name: استقرار در آروان‌کلاد

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدها (Checkout)
        uses: actions/checkout@v4

      - name: راه‌اندازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: نصب وابستگی‌ها و بیلد پروژه
        run: |
          npm install
          npm run build

      - name: تنظیم ابزار AWS CLI برای اتصال به آروان
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ARVAN_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ARVAN_SECRET_KEY }}
          aws-region: us-east-1

      - name: همگام‌سازی فایل‌ها با صندوقچه آروان‌کلاد (Sync)
        run: |
          aws s3 sync ./dist s3://abwalfdltnha178.ir \
            --endpoint-url https://s3.ir-thr-at1.arvanstorage.ir \
            --delete
