name: استقرار در آروان‌کلاد

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدها (Checkout)
        uses: actions/checkout@v4

      - name: راه‌اندازی Node.js نسخه 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: نصب وابستگی‌ها و بیلد پروژه
        run: |
          npm install
          npm run build

      - name: همگام‌سازی فایل‌ها با صندوقچه آروان‌کلاد (Sync)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 sync ./dist s3://abwalfdltnha178.ir \
            --endpoint-url https://s3.ir-central1.arvanstorage.ir \
            --delete
